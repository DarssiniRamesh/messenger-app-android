apply plugin: 'com.android.application'
apply from: "https://cdn.mesibo.com/android/mesibo.gradle"
apply plugin: 'jacoco'


ext {
    PUBLISH_VERSION = "1.0.0"
    PUBLISH_VERSION_CODE = 1
}


android {

    compileSdkVersion project.Mesibo_compileSdkVersion

    defaultConfig {
        applicationId "org.mesibo.messenger"
        minSdkVersion project.Mesibo_minSdkVersion
        targetSdkVersion project.Mesibo_targetSdkVersion
        versionCode project.PUBLISH_VERSION_CODE
        versionName project.PUBLISH_VERSION
        buildConfigField "String", "BUILD_VERSION", "\"${project.PUBLISH_VERSION}\""
        buildConfigField "String", "BUILD_TIMESTAMP", "\"${project.Mesibo_buildDate}\""
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    lintOptions {
        disable 'MissingTranslation'
    }

    compileOptions {
      sourceCompatibility 1.8
      targetCompatibility 1.8
    }


    buildTypes {
        release {
            minifyEnabled false
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            testCoverageEnabled true
        }

        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            testCoverageEnabled true
        }

    }
    
    // JaCoCo configuration
    jacoco {
        toolVersion = "0.8.7"
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    // Unit testing dependencies
    testImplementation 'junit:junit:4.12'
    testImplementation 'org.mockito:mockito-core:3.11.2'
    testImplementation 'org.robolectric:robolectric:4.8'
    testImplementation 'androidx.test:core:1.4.0'
    testImplementation 'androidx.test:rules:1.4.0'
    testImplementation 'com.google.truth:truth:1.1.3'

    // Instrumented testing dependencies
    androidTestImplementation 'androidx.test:core:1.4.0'
    androidTestImplementation 'androidx.test:rules:1.4.0'
    androidTestImplementation 'org.mockito:mockito-android:3.11.2'
    androidTestImplementation 'com.google.truth:truth:1.1.3'

    implementation "androidx.appcompat:appcompat:1.0.0"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"
    implementation "androidx.recyclerview:recyclerview:1.0.0"
    implementation "androidx.cardview:cardview:1.0.0"
    implementation "androidx.annotation:annotation:1.0.0"
    implementation "com.google.android.material:material:1.0.0"
    implementation "androidx.preference:preference:1.0.0"

    implementation "com.google.android.gms:play-services-maps:${project.Mesibo_playServiceVersion}"
    implementation "com.google.android.gms:play-services-location:${project.Mesibo_playServiceVersion}"
    implementation "com.google.android.gms:play-services-places:${project.Mesibo_playServiceVersion}"
    implementation "com.google.firebase:firebase-messaging:18.0.0"
    implementation 'com.google.firebase:firebase-core:16.0.9'

    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    annotationProcessor 'com.jakewharton:butterknife:7.0.1'
    implementation "com.google.code.gson:gson:${project.Mesibo_gsonVersion}"

    implementation "com.mesibo.api:uihelper:${project.MesiboVersion_UiHelper}"
    implementation "com.mesibo.api:mesibo:${project.MesiboVersion_Api}"
    implementation "com.mesibo.api:ui:${project.MesiboVersion_Ui}"
    implementation "com.mesibo.api:callui:${project.MesiboVersion_CallUi}"
}

// this line needs to be at bottom else it gives error of version conflict
apply plugin: 'com.google.gms.google-services'

// JaCoCo test report tasks
tasks.withType(Test) {
    jacoco.includeNoLocationClasses = true
    jacoco.excludes = ['jdk.internal.*']
}

// Task to generate full coverage report
task jacocoTestReport(type: JacocoReport, dependsOn: ['testDebugUnitTest']) {
    group = "Reporting"
    description = "Generate Jacoco coverage reports for Debug build"

    reports {
        xml.enabled = true
        html.enabled = true
        csv.enabled = false
    }

    def fileFilter = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*']
    def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"

    sourceDirectories.from = files([mainSrc])
    classDirectories.from = files([debugTree])
    executionData.from = fileTree(dir: "$buildDir", includes: [
            "jacoco/testDebugUnitTest.exec",
            "outputs/code-coverage/connected/*coverage.ec"
    ])
}

// Task to generate coverage report for specific components
task jacocoCoreComponentsReport(type: JacocoReport, dependsOn: ['testDebugUnitTest']) {
    group = "Reporting"
    description = "Generate Jacoco coverage reports for core components"

    reports {
        xml.enabled = true
        html.enabled = true
        csv.enabled = true
    }

    def fileFilter = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*']
    def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"

    // Include only the core components we want to analyze
    def coreComponents = [
        '**/NotifyUser.class',
        '**/UIManager.class',
        '**/MesiboFileTransferHelper.class',
        '**/MainApplication.class'
    ]
    
    classDirectories.from = files([debugTree.matching {
        include coreComponents
    }])
    
    sourceDirectories.from = files([mainSrc])
    executionData.from = fileTree(dir: "$buildDir", includes: [
            "jacoco/testDebugUnitTest.exec",
            "outputs/code-coverage/connected/*coverage.ec"
    ])
}

// Task to generate detailed metrics for core components
task generateCoreComponentsCoverageMetrics(type: JacocoReport, dependsOn: ['testDebugUnitTest']) {
    group = "Reporting"
    description = "Generate detailed test coverage metrics for core components"

    reports {
        xml.enabled = true
        html {
            enabled = true
            destination file("${buildDir}/reports/jacoco/coreComponentsMetrics")
        }
        csv {
            enabled = true
            destination file("${buildDir}/reports/jacoco/coreComponentsMetrics/core-components-metrics.csv")
        }
    }

    def fileFilter = ['**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*', '**/*Test*.*', 'android/**/*.*']
    def debugTree = fileTree(dir: "${buildDir}/intermediates/javac/debug", excludes: fileFilter)
    def mainSrc = "${project.projectDir}/src/main/java"

    // Specifically target the core components
    def coreComponents = [
        '**/NotifyUser.class',
        '**/UIManager.class',
        '**/MesiboFileTransferHelper.class',
        '**/MainApplication.class'
    ]
    
    classDirectories.from = files([debugTree.matching {
        include coreComponents
    }])
    
    sourceDirectories.from = files([mainSrc])
    executionData.from = fileTree(dir: "$buildDir", includes: [
            "jacoco/testDebugUnitTest.exec",
            "outputs/code-coverage/connected/*coverage.ec"
    ])
    
    doLast {
        println "Core Components Coverage Report generated at: ${reports.html.destination}"
        
        // Generate a summary of the metrics
        def metricsFile = new File("${buildDir}/reports/jacoco/coreComponentsMetrics/metrics-summary.txt")
        metricsFile.text = """
        |==========================================================
        |     CORE COMPONENTS TEST COVERAGE METRICS SUMMARY
        |==========================================================
        | Report generated on: ${new Date()}
        |
        | Components analyzed:
        | - NotifyUser
        | - UIManager
        | - MesiboFileTransferHelper
        | - MainApplication
        |
        | Metrics included:
        | - Line coverage
        | - Branch coverage
        | - Method coverage
        | - Class coverage
        |
        | Full HTML report available at:
        | ${reports.html.destination}/index.html
        |
        | CSV data available at:
        | ${reports.csv.destination}
        |==========================================================
        """.stripMargin()
        
        println "Coverage metrics summary written to: ${metricsFile.absolutePath}"
        
        // Run the detailed coverage report test
        tasks.create(name: 'runDetailedCoverageReport', type: Test) {
            include '**/DetailedCoverageReport.class'
            testLogging {
                events "passed", "skipped", "failed"
            }
        }.execute()
        
        // Run the component structure analyzer
        tasks.create(name: 'runComponentStructureAnalyzer', type: Test) {
            include '**/CoverageMetricsAnalyzer.class'
            testLogging {
                events "passed", "skipped", "failed"
            }
        }.execute()
        
        // Run the JSON metrics generator
        tasks.create(name: 'runJsonMetricsGenerator', type: Test) {
            include '**/CoverageMetricsJsonGenerator.class'
            testLogging {
                events "passed", "skipped", "failed"
            }
        }.execute()
    }
}

// Task to run all coverage-related tasks
task generateAllCoverageReports(dependsOn: ['generateCoreComponentsCoverageMetrics']) {
    group = "Reporting"
    description = "Generate all coverage reports including detailed metrics and analysis"
    
    doLast {
        println "All coverage reports generated successfully"
        println "Reports available at: ${buildDir}/reports/jacoco/"
    }
}

